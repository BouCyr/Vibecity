<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vibecity — Medieval City Generator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside id="panel">
    <header class="panel-header">
      <h1>Vibecity</h1>
      <button id="panel-toggle" title="Collapse panel" aria-label="Collapse panel">&laquo;</button>
    </header>
    <div class="panel-body">
      <section class="seed-box">
        <label for="seed">Seed</label>
        <div class="seed-row">
          <input id="seed" type="text" spellcheck="false">
          <button id="seed-random" title="Random seed">&#x1F3B2;</button>
        </div>
      </section>
      <ol id="steps"></ol>
      <div id="status"></div>
    </div>
  </aside>
  <main id="stage">
    <canvas id="map"></canvas>
  </main>

  <script src="js/rng.js"></script>
  <script src="js/steps/points.js"></script>
  <script src="js/steps/voronoi.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
